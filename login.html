<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to your Saffron & Stone account.">
  <title>Log In | Saffron & Stone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-banner compact-banner"><div class="container"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p>Your favorite table is just around the corner.</p></div></section>
    <div class="container"><nav aria-label="breadcrumb"><ol class="breadcrumb custom-breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Log in</li></ol></nav></div>
    <section class="container auth-section">
      <div class="auth-card login-card">
        <div class="auth-heading"><span class="eyebrow">GOOD TO HAVE YOU BACK</span><h2>Come on in.</h2><p>Log in to make yourself at home.</p></div>
        <form class="needs-validation" data-demo-auth novalidate>
          <div class="mb-3"><label class="form-label" for="loginUsername">Username</label><input class="form-control" id="loginUsername" name="username" autocomplete="username" required><div class="invalid-feedback">Please enter your username.</div></div>
          <div class="mb-4"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" name="password" type="password" autocomplete="current-password" required><div class="invalid-feedback">Please enter your password.</div></div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Log in <i class="bi bi-arrow-right ms-2"></i></button><div class="form-feedback" aria-live="polite"></div>
        </form>
        <p class="auth-switch">New around here? <a href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
